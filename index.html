<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gokul | Credit Card Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b3d;--mut:#5b6b85;--line:#dbe3ef;--acc:#1f2f8a;--acc2:#0a8a6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#151e33;--ink:#eaf0fb;--mut:#95a3bd;--line:#27334d;--acc:#2f3fb0;--acc2:#12a07c}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#151e33;--ink:#eaf0fb;--mut:#95a3bd;--line:#27334d;--acc:#2f3fb0;--acc2:#12a07c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:56px 16px 16px}
.cc{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),#0f1b3d);color:#fff;border-radius:20px;padding:20px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cc>div{position:relative;z-index:1}
.cc .bg{position:absolute;inset-inline-end:-30px;top:-50px;opacity:.16;pointer-events:none}
.chipg{position:absolute;inset-inline-start:20px;top:70px}
.cc small{opacity:.9;font-weight:500;letter-spacing:.02em}
.cc h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:8px 0 14px}
.row,.tools{display:flex;gap:10px;margin-bottom:14px}
.tools{flex-wrap:wrap;margin-bottom:18px}
.btn{flex:1;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.tools .btn{font-size:13px;padding:10px 8px}
.btn.p{background:var(--acc2);color:#fff;border-color:var(--acc2)}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:24px 0 10px}
.banner{background:var(--acc2);color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:center;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.info{flex:1;min-width:0}.item b{display:block}.item span{color:var(--mut);font-size:14px}
.th{flex:0 0 54px;height:36px;border-radius:7px;position:relative}
.th::after{content:"";position:absolute;inset-inline-start:6px;top:7px;width:12px;height:9px;border-radius:2px;background:#e6c36a}
.mini{padding:7px 12px;border-radius:10px;border:1px solid var(--acc2);color:var(--acc2);background:none;font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bk span{padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px}
input.ck{width:18px;height:18px;margin:0;padding:0;flex:0 0 auto}
label{font-size:13px;color:var(--mut);display:block}
.err{color:#c0392b;font-size:14px;min-height:20px}
.box{background:var(--card);border-radius:14px;padding:14px;margin-top:12px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px}
.cmp th,.cmp td{padding:9px;border-bottom:1px solid var(--line);text-align:start}
#qr{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:14px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none}
#adm{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#adm.open{display:block}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tg input{width:auto;margin:0}
.crow{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px}
.crow input{margin:2px 0 6px}
#pop{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px;display:none}
#pop.open{display:block}
#pop div{max-width:440px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px}
#pop a{color:var(--bg);font-weight:600;font-size:18px;text-decoration:none;flex:1}
#pop button{background:none;border:0;color:var(--bg);font-size:22px;cursor:pointer}
#corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;display:flex;gap:6px;z-index:7}
.cb{min-width:36px;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.own{text-align:center;margin:28px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="adm"></div>
<div id="pop"></div>
<div id="toast" class="toast"></div>
<div id="corner"></div>
<script id="data" type="application/json">{"name":"Gokul","title":"Credit card advisor","tag":"UAE · All major banks","phone":"+971527074559","wa":"+971527074559","url":"https://claude.ai/artifact/SuwGFKFkuL5Xw2D2hrRBN9","delay":8,"t":{"cards":true,"banks":true,"elig":true,"wa":true,"popup":true,"offers":true,"compare":true,"calc":true,"share":true,"ar":true},"offers":["Free for life on selected cards this month","Apply today, approval in 24 hours"],"cards":[{"n":"Cashback Plus","cat":"Cashback","d":"Up to 5% back on groceries","fee":"Free for life","cb":5,"min":5000},{"n":"Miles Elite","cat":"Travel","d":"Miles on every spend plus lounge access","fee":"AED 0 first year","cb":1.5,"min":10000},{"n":"Lifestyle Rewards","cat":"Lifestyle","d":"Dining and entertainment offers","fee":"Free for life","cb":2,"min":8000}],"banks":["CBD","Emirates NBD","ADCB","FAB","Mashreq","RAKBANK"]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var D=JSON.parse(document.getElementById('data').textContent);
D.t=Object.assign({offers:true,compare:true,calc:true,share:true,ar:true,refer:true,theme:true},D.t);
D.offers=D.offers||[];D.url=D.url||'';
D.refMsg=D.refMsg||('Hi! I found a great credit card advisor, '+D.name+'. Check your eligibility and offers here:');
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var TR={en:{flip:'Tap the card to flip it',call:'Call',wa:'WhatsApp',save:'Save contact',share:'Share',qr:'QR code',all:'All',cards:'Cards',banks:'Banks I work with',find:'Find my best card',name:'Name',mob:'Mobile number',sal:'Monthly salary (AED)',emp:'Employment',sa:'Salaried',se:'Self-employed',chk:'Check eligibility',need:'Enter your name and mobile number.',apply:'Apply',cmp:'Compare',fee:'Annual fee',cb:'Cashback',min:'Min. salary',calc:'Cashback calculator',spend:'Monthly spend (AED)',mo:'per month',yr:'per year',best:'Best match',cont:'Continue on WhatsApp',none:'No match yet. Message me for options.',copied:'Number copied',link:'Link copied',contact:'Contact',tapc:'Tap Call or WhatsApp below',pick:'Select 2 or 3 cards to compare',hi:'Hi',light:'Light',dark:'Dark',ref:'Refer a friend',refd:'Know someone who needs a credit card? Send them my details.',fname:"Friend's name",fmob:"Friend's mobile (optional)",send:'Send on WhatsApp'},
ar:{flip:'اضغط على البطاقة لقلبها',call:'اتصال',wa:'واتساب',save:'حفظ جهة الاتصال',share:'مشاركة',qr:'رمز QR',all:'الكل',cards:'البطاقات',banks:'البنوك التي أتعامل معها',find:'اعثر على أفضل بطاقة',name:'الاسم',mob:'رقم الجوال',sal:'الراتب الشهري (درهم)',emp:'نوع العمل',sa:'موظف',se:'عمل حر',chk:'تحقق من الأهلية',need:'أدخل اسمك ورقم جوالك.',apply:'قدّم الآن',cmp:'مقارنة',fee:'الرسوم السنوية',cb:'الاسترداد النقدي',min:'الحد الأدنى للراتب',calc:'حاسبة الاسترداد النقدي',spend:'الإنفاق الشهري (درهم)',mo:'شهرياً',yr:'سنوياً',best:'الأنسب لك',cont:'تابع عبر واتساب',none:'لا توجد نتيجة بعد. راسلني لمعرفة الخيارات.',copied:'تم نسخ الرقم',link:'تم نسخ الرابط',contact:'التواصل',tapc:'اضغط اتصال أو واتساب أدناه',pick:'اختر بطاقتين أو ثلاث للمقارنة',hi:'مرحباً',light:'فاتح',dark:'داكن',ref:'رشّح صديقاً',refd:'تعرف شخصاً يحتاج بطاقة ائتمان؟ أرسل له بياناتي.',fname:'اسم صديقك',fmob:'جوال صديقك (اختياري)',send:'أرسل عبر واتساب'}};
var SAL=[{v:4000,en:'Below 5,000',ar:'أقل من 5,000'},{v:7500,en:'5,000 – 10,000',ar:'5,000 – 10,000'},{v:15000,en:'10,000 – 20,000',ar:'10,000 – 20,000'},{v:25000,en:'Above 20,000',ar:'أكثر من 20,000'}];
var lang='en',flip=false,filter='',cats=[],sel=[],owner=false,popTimer=null,bt=null,bi=0;
try{lang=localStorage.getItem('lg')==='ar'?'ar':'en'}catch(e){}
var T=function(k){return(TR[lang]&&TR[lang][k])||TR.en[k]||k};
var waNum=function(){return String(D.wa).replace(/\D/g,'')};
var GFX='<svg class="bg" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.5"><circle cx="160" cy="90" r="40"/><circle cx="160" cy="90" r="70"/><circle cx="160" cy="90" r="100"/></g></svg><svg class="chipg" width="84" height="30" viewBox="0 0 84 30" aria-hidden="true"><rect y="1" width="38" height="28" rx="6" fill="#e6c36a"/><path d="M0 10h38M0 20h38M13 1v28M25 1v28" stroke="#b8942f" stroke-width="1" fill="none"/><path d="M52 8c5 4 5 10 0 14M60 4c8 7 8 15 0 22M68 0c11 10 11 20 0 30" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></svg>';
function tint(c){var p=['#1f2f8a','#0a8a6a','#7c3aed','#d97706','#be123c'];return p[Math.max(0,cats.indexOf(c))%p.length]}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(function(){t.style.display='none'},2200)}

function shell(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#app').innerHTML='<div class="wrap"><div id="ban"></div><div id="cc"></div><div class="hint">'+T('flip')+'</div><div class="row" id="act"></div><div class="tools" id="tools"></div><div id="qrw"></div><div id="cards"></div><div id="cmp"></div><div id="calc"></div><div id="banks"></div><div id="elig"></div><div id="ref"></div><div class="own" id="own"></div></div>';
  ban();card();acts();tools();cardsSec();cmpSec();calcSec();banksSec();eligSec();refSec();ownBtn();
}
function ban(){
  clearInterval(bt);var el=$('#ban');
  if(!D.t.offers||!D.offers.length){el.innerHTML='';return}
  var show=function(){el.innerHTML='<div class="banner">'+esc(D.offers[bi%D.offers.length])+'</div>';bi++};
  show();if(D.offers.length>1)bt=setInterval(show,3500);
}
function card(){
  var h=flip
   ?'<div><small>'+T('contact')+'</small></div><div><h1 dir="ltr">'+esc(D.phone)+'</h1><small>'+T('tapc')+'</small></div>'
   :'<div><small>'+esc(D.title)+'</small></div><div><h1>'+esc(D.name)+'</h1><small>'+esc(D.tag)+'</small></div>';
  $('#cc').innerHTML='<div class="cc" onclick="flip=!flip;card()">'+GFX+h+'</div>';
}
function acts(){
  var h='<a class="btn" href="tel:'+esc(D.phone)+'">'+T('call')+'</a>';
  if(D.t.wa)h+='<a class="btn p" href="https://wa.me/'+waNum()+'" target="_blank" rel="noopener">'+T('wa')+'</a>';
  $('#act').innerHTML=h;
}
var SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function tools(){
  var h='<button class="btn" onclick="saveC()">'+T('save')+'</button>';
  if(D.t.share){h+='<button class="btn" onclick="shareP()">'+T('share')+'</button>';if(window.QRCode)h+='<button class="btn" onclick="qr()">'+T('qr')+'</button>'}
  $('#tools').innerHTML=h;
  var k='';
  if(D.t.theme)k+='<button class="cb" aria-label="'+(curTh()==='dark'?T('light'):T('dark'))+'" onclick="setTh()">'+(curTh()==='dark'?SUN:MOON)+'</button>';
  if(D.t.ar)k+='<button class="cb" onclick="setL()">'+(lang==='ar'?'EN':'العربية')+'</button>';
  $('#corner').innerHTML=k;
}
function curTh(){return document.documentElement.getAttribute('data-theme')||'light'}
function setTh(){var n=curTh()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('th',n)}catch(e){}tools()}
function refSec(){
  $('#ref').innerHTML=D.t.refer?'<h2>'+T('ref')+'</h2><div class="box" style="margin-top:0"><p style="margin:0 0 10px;color:var(--mut);font-size:14px">'+T('refd')+'</p><label>'+T('fname')+'</label><input id="rn"><label>'+T('fmob')+'</label><input id="rm" type="tel"><a class="btn p" style="display:block" target="_blank" rel="noopener" href="#" onclick="return sendRef(this)">'+T('send')+'</a></div>':'';
}
function sendRef(a){
  var n=$('#rn').value.trim(),m=$('#rm').value.replace(/\D/g,'');
  a.href='https://wa.me/'+m+'?text='+encodeURIComponent((n?T('hi')+' '+n+'! ':'')+D.refMsg+' '+D.url);
  return true;
}
function setL(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lg',lang)}catch(e){}shell()}
async function saveC(){
  var v='BEGIN:VCARD\nVERSION:3.0\nFN:'+D.name+'\nTITLE:'+D.title+'\nTEL;TYPE=CELL:'+D.phone+'\nURL:'+D.url+'\nEND:VCARD';
  try{
    var f=new File([v],D.name+'.vcf',{type:'text/vcard'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:D.name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(D.name+' '+D.phone);toast(T('copied'))}catch(e){location.href='tel:'+D.phone}
}
async function shareP(){
  if(navigator.share){try{await navigator.share({title:D.name,url:D.url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(D.url);toast(T('link'))}catch(e){}
}
function qr(){
  var w=$('#qrw');
  if(w.innerHTML){w.innerHTML='';return}
  w.innerHTML='<div id="qr"></div>';
  new QRCode($('#qr'),{text:D.url,width:200,height:200});
}
function cardsSec(){
  var el=$('#cards');
  if(!D.t.cards){el.innerHTML='';return}
  cats=Array.from(new Set(D.cards.map(function(c){return c.cat})));
  if(filter&&cats.indexOf(filter)<0)filter='';
  var chips='<button class="chip'+(!filter?' on':'')+'" onclick="setF(-1)">'+T('all')+'</button>'+cats.map(function(c,i){return'<button class="chip'+(c===filter?' on':'')+'" onclick="setF('+i+')">'+esc(c)+'</button>'}).join('');
  var list=D.cards.map(function(c,i){return{c:c,i:i}}).filter(function(x){return!filter||x.c.cat===filter}).map(function(x){
    var c=x.c,msg=T('hi')+' '+D.name+', I am interested in the '+c.n+' card.';
    return'<div class="item">'+(D.t.compare?'<input class="ck" type="checkbox" aria-label="'+T('cmp')+'"'+(sel.indexOf(x.i)>=0?' checked':'')+' onchange="pick('+x.i+',this.checked)">':'')+'<i class="th" style="background:'+tint(c.cat)+'"></i><div class="info"><b>'+esc(c.n)+'</b><span>'+esc(c.d)+'</span></div><a class="mini" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg)+'">'+T('apply')+'</a></div>'}).join('');
  el.innerHTML='<h2>'+T('cards')+'</h2><div class="chips">'+chips+'</div>'+list;
}
function setF(i){filter=i<0?'':cats[i];cardsSec()}
function pick(i,on){
  var k=sel.indexOf(i);
  if(on&&k<0){if(sel.length>=3){cardsSec();return}sel.push(i)}
  if(!on&&k>=0)sel.splice(k,1);
  cmpSec();
}
function cmpSec(){
  var el=$('#cmp');
  if(!D.t.cards||!D.t.compare){el.innerHTML='';return}
  if(sel.length<2){el.innerHTML=sel.length===1?'<div class="hint">'+T('pick')+'</div>':'';return}
  var cs=sel.map(function(i){return D.cards[i]}).filter(Boolean);
  var row=function(l,f){return'<tr><th>'+l+'</th>'+cs.map(function(c){return'<td>'+f(c)+'</td>'}).join('')+'</tr>'};
  el.innerHTML='<h2>'+T('cmp')+'</h2><div style="overflow-x:auto"><table class="cmp"><tr><th></th>'+cs.map(function(c){return'<th>'+esc(c.n)+'</th>'}).join('')+'</tr>'+row(T('fee'),function(c){return esc(c.fee||'-')})+row(T('cb'),function(c){return c.cb?c.cb+'%':'-'})+row(T('min'),function(c){return c.min?'AED '+Number(c.min).toLocaleString('en'):'-'})+'</table></div>';
}
function calcSec(){
  $('#calc').innerHTML=D.t.calc?'<h2>'+T('calc')+'</h2><label>'+T('spend')+'</label><input id="sp" type="number" inputmode="numeric" min="0" oninput="calc()"><div id="cr"></div>':'';
}
function calc(){
  var s=+$('#sp').value||0;
  if(!s){$('#cr').innerHTML='';return}
  var r=D.cards.filter(function(c){return c.cb}).map(function(c){return{c:c,m:s*c.cb/100}}).sort(function(a,b){return b.m-a.m});
  $('#cr').innerHTML=r.map(function(x,i){return'<div class="item"><div class="info"><b>'+esc(x.c.n)+(i===0?' · '+T('best'):'')+'</b><span>AED '+x.m.toFixed(0)+' '+T('mo')+' · AED '+(x.m*12).toFixed(0)+' '+T('yr')+'</span></div></div>'}).join('');
}
function banksSec(){
  $('#banks').innerHTML=D.t.banks?'<h2>'+T('banks')+'</h2><div class="bk">'+D.banks.map(function(b){return'<span>'+esc(b)+'</span>'}).join('')+'</div>':'';
}
function eligSec(){
  $('#elig').innerHTML=D.t.elig?'<h2>'+T('find')+'</h2><label>'+T('name')+'</label><input id="en" autocomplete="name"><label>'+T('mob')+'</label><input id="ep" type="tel" autocomplete="tel"><label>'+T('sal')+'</label><select id="es">'+SAL.map(function(s,i){return'<option value="'+i+'">'+s[lang]+'</option>'}).join('')+'</select><label>'+T('emp')+'</label><select id="ee"><option value="0">'+T('sa')+'</option><option value="1">'+T('se')+'</option></select><div class="err" id="err"></div><button class="btn p" style="width:100%" onclick="chk()">'+T('chk')+'</button><div id="res"></div>':'';
}
function chk(){
  var n=$('#en').value.trim(),p=$('#ep').value.trim();
  if(!n||!p){$('#err').textContent=T('need');return}
  $('#err').textContent='';
  var s=SAL[+$('#es').value],e=+$('#ee').value;
  var rec=D.cards.filter(function(c){return!c.min||c.min<=s.v}).sort(function(a,b){return(b.cb||0)-(a.cb||0)});
  var msg='Hi '+D.name+', please check my card eligibility.\nName: '+n+'\nMobile: '+p+'\nSalary: '+s.en+'\nEmployment: '+(e?'Self-employed':'Salaried')+(rec.length?'\nInterested in: '+rec.slice(0,2).map(function(c){return c.n}).join(', '):'');
  $('#res').innerHTML='<div class="box"><b>'+T('best')+'</b>'+(rec.length?rec.slice(0,3).map(function(c){return'<div style="margin-top:6px">'+esc(c.n)+' <span style="color:var(--mut)">· '+esc(c.d)+'</span></div>'}).join(''):'<div style="margin-top:6px">'+T('none')+'</div>')+'<a class="btn p" style="display:block;margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg)+'">'+T('cont')+'</a></div>';
}
function ownBtn(){$('#own').innerHTML=owner?'<button class="chip" onclick="openAdm()">Admin panel</button>':''}

function showPop(){
  clearTimeout(popTimer);
  if(!D.t.popup||owner)return;
  popTimer=setTimeout(function(){
    $('#pop').innerHTML='<div><a href="tel:'+esc(D.phone)+'">'+T('call')+' '+esc(D.phone)+'</a><button aria-label="Close" onclick="$(\'#pop\').className=\'\'">×</button></div>';
    $('#pop').className='open';
  },Math.max(0,+D.delay||0)*1000);
}

function openAdm(){admRender();$('#adm').className='open'}
function closeAdm(){$('#adm').className='';sel=[];shell();showPop()}
function admRender(){
  var tl={cards:'Show cards',banks:'Show banks',elig:'Show eligibility check',wa:'Show WhatsApp button',popup:'Contact number popup',offers:'Offers banner',compare:'Card comparison',calc:'Cashback calculator',share:'Share and QR',ar:'Arabic toggle',refer:'Refer a friend',theme:'Light/dark toggle'};
  var h='<div class="wrap"><h2>Admin panel</h2>';
  [['name','Name'],['title','Title'],['tag','Tagline'],['phone','Phone'],['wa','WhatsApp number'],['url','Page link (used for Share and QR)']].forEach(function(f){
    h+='<label>'+f[1]+'</label><input value="'+esc(D[f[0]])+'" onchange="D.'+f[0]+'=this.value">';
  });
  h+='<label>Popup delay (seconds)</label><input type="number" min="0" value="'+esc(D.delay)+'" onchange="D.delay=+this.value"><h2>Features</h2>';
  Object.keys(tl).forEach(function(k){
    h+='<div class="tg"><span>'+tl[k]+'</span><input type="checkbox"'+(D.t[k]?' checked':'')+' onchange="D.t.'+k+'=this.checked"></div>';
  });
  h+='<label>Refer a friend message (the page link is added automatically)</label><textarea rows="3" onchange="D.refMsg=this.value">'+esc(D.refMsg)+'</textarea><h2>Offers banner</h2><label>One offer per line</label><textarea rows="3" onchange="D.offers=this.value.split(\'\\n\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.offers.join('\n'))+'</textarea><h2>Cards</h2>';
  D.cards.forEach(function(c,i){
    h+='<div class="crow"><input placeholder="Name" value="'+esc(c.n)+'" onchange="D.cards['+i+'].n=this.value"><input placeholder="Category" value="'+esc(c.cat)+'" onchange="D.cards['+i+'].cat=this.value"><input placeholder="Description" value="'+esc(c.d)+'" onchange="D.cards['+i+'].d=this.value"><input placeholder="Annual fee" value="'+esc(c.fee||'')+'" onchange="D.cards['+i+'].fee=this.value"><input type="number" step="0.1" placeholder="Cashback %" value="'+esc(c.cb||'')+'" onchange="D.cards['+i+'].cb=+this.value"><input type="number" placeholder="Min. salary (AED)" value="'+esc(c.min||'')+'" onchange="D.cards['+i+'].min=+this.value"><button class="chip" onclick="D.cards.splice('+i+',1);admRender()">Remove</button></div>';
  });
  h+='<button class="chip" onclick="D.cards.push({n:\'New card\',cat:\'General\',d:\'\',fee:\'\',cb:0,min:0});admRender()">Add card</button>';
  h+='<h2>Banks</h2><label>Separate with commas</label><textarea rows="3" onchange="D.banks=this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.banks.join(', '))+'</textarea>';
  h+='<div class="err" id="st"></div><div class="row"><button class="btn" onclick="closeAdm()">Close</button><button class="btn p" onclick="save()">Save and publish</button></div></div>';
  $('#adm').innerHTML=h;
}
async function save(){
  var st=$('#st');st.style.color='var(--mut)';st.textContent='Publishing…';
  try{
    var a=await claude.use('artifact');
    if(!a){st.style.color='#c0392b';st.textContent='Publishing is not available in this view.';return}
    var c=document.documentElement.cloneNode(true);
    c.removeAttribute('dir');c.removeAttribute('data-theme');c.setAttribute('lang','en');
    ['#app','#adm','#pop','#toast','#corner'].forEach(function(s){var n=c.querySelector(s);n.innerHTML='';n.textContent='';n.removeAttribute('style');if(s!=='#toast')n.className=''});
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    await a.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(e){
    st.style.color='#c0392b';
    st.textContent=(e&&e.code==='conflict')?'Someone else published first. The page reloaded.':'Could not publish. Only the page owner can save changes.';
  }
}

if(D.t.theme){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('th')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}}
shell();showPop();
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var u=await claude.use('user');
    if(u&&u.isOwner()){owner=true;ownBtn();clearTimeout(popTimer);$('#pop').className=''}
  }catch(e){}
})();
</script>
</body>
</html>
