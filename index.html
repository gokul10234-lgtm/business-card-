<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b3d;--mut:#5b6b85;--line:#dbe3ef;--acc:#1f2f8a;--acc2:#0a8a6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bk{display:flex;gap:8px;flex-wrap:wrap}

label{font-size:13px;color:var(--mut);display:block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none}

#adm input,#adm select,#adm textarea{border:2px solid var(--mut);min-height:46px}

.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tg input{width:auto;margin:0}
.crow{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px}
.crow input{margin:2px 0 6px}
#pop{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:12px;display:none}

.qrc{background:#fff;padding:6px;border-radius:10px;line-height:0;flex:0 0 auto}

.fab{position:fixed;inset-inline-end:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;padding:0;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.chatp{position:fixed;left:10px;right:10px;max-width:420px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:min(70vh,520px);background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:7;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--acc);color:#fff}

.cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mb{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;background:var(--bg);color:var(--ink);align-self:flex-start;white-space:pre-wrap}

.cin input{margin:0;flex:1}
.cin .btn{flex:0 0 auto;padding:8px 14px}
.cw{display:block;text-align:center;padding:9px;font-size:13px;font-weight:600;color:var(--acc2);text-decoration:none;border-top:1px solid var(--line)}
#corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;display:flex;gap:6px;z-index:7}
.cb{min-width:36px;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.own{text-align:center;margin:28px 0 8px}

/* ===== Dubai-it editorial theme: warm off-white, black type, hairlines, pill buttons ===== */
:root{--bg:#EDECE8;--card:#ffffff;--ink:#171715;--mut:#7a7a74;--line:#cfcfca;--acc:#171715;--acc2:#171715}

body{letter-spacing:-.005em}

.cc{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px),linear-gradient(135deg,#e4e5e7 0%,#a9abb0 28%,#d3d4d7 52%,#8e9096 78%,#bfc1c5 100%);color:#1f2024;border-radius:20px;padding:20px 22px;min-height:0;aspect-ratio:1.586/1;border:1px solid rgba(255,255,255,.75);box-shadow:0 16px 32px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(0,0,0,.18);gap:0}

@media(max-width:360px){.cc h1{font-size:32px}.chipg{top:30%;transform:scale(.85);transform-origin:left top}}
.cc .bg{display:block;opacity:.35}

.cc>div:first-child small{color:#1f2024;opacity:.7}
.qrc{border:1px solid var(--line);border-radius:12px}
.hint{color:var(--mut)}
h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:36px 0 10px}
.btn{border-radius:999px;border:0;background:#fff;color:var(--ink);font-weight:500}
:root[data-theme="dark"] .btn{background:var(--card)}
.btn.p{background:var(--ink);color:var(--bg)}
#act .btn,#elig .btn.p,.box a.btn.p{display:flex;justify-content:space-between;align-items:center;text-align:start;padding:16px 22px;font-size:17px}
#act .btn::after,#elig .btn.p::after,.box a.btn.p::after{content:"\203A";font-size:24px;line-height:1;font-weight:400}
.tools .btn{background:transparent;border:1px solid var(--line);font-weight:500}
.chip{border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{display:flex;align-items:stretch;padding:0;overflow:hidden;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:999px;text-align:start;font-weight:500}
.banner .bt{background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;padding:11px 15px;flex:0 0 auto}
.banner .bx{flex:1;padding:11px 15px;font-size:13px;display:flex;align-items:center}
.item{background:none;border-radius:0;border-bottom:1px solid var(--line);padding:16px 0;margin:0}
.item span{color:var(--mut);font-style:normal}
#cards,#calc{counter-reset:n}
#cards .item,#calc .item{counter-increment:n}
#cards .item::before,#calc .item::before{content:counter(n) ".";color:var(--mut);flex:0 0 26px;font-size:16px}
.th{display:none}
.mini{border-radius:999px;border:1px solid var(--ink);color:var(--ink)}
.bk span{border-radius:999px;background:transparent;border:1px solid var(--line)}
.box{background:none;border-radius:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
table.cmp{background:none;border-radius:0}
input,select,textarea{border-radius:14px;background:var(--card)}
.fab{background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.chatp{background:var(--bg);border-radius:20px}
.ch{background:var(--ink);color:var(--bg)}
.ch button{color:var(--bg)}
.mb{background:var(--card)}
.mb.u{background:var(--ink);color:var(--bg)}
.cw{color:var(--ink)}
.cb{background:var(--card);box-shadow:none}
#pop div{border-radius:999px}
.toast{border-radius:999px}

/* ===== green WhatsApp buttons and chat assistant ===== */
:root{--wa:#128C4A}
a.btn.p[href*="wa.me"],a.btn.p[onclick*="docsSend"],a.btn.p[onclick*="sendRef"],a.btn.p[onclick*="bookSend"]{background:var(--wa);color:#fff}
.box a.btn.p{display:flex!important;justify-content:space-between;align-items:center}
.mini[href*="wa.me"]{border-color:var(--wa);color:var(--wa)}
.fab span span{border-color:var(--wa)!important}
.fab svg[style*="position:absolute"] circle{fill:var(--wa)}

.ch button{color:#fff}
.ch span span{border-color:#fff!important}
.ch svg[style*="position:absolute"] circle{fill:#0b5e32}
.mb.u{background:var(--wa);color:#fff}
.cin .btn.p{background:var(--wa);color:#fff}
.cw{color:var(--wa)}
</style>

<script>
var D=JSON.parse(document.getElementById('data').textContent);
if(!(window.claude&&window.claude.use)){try{var _o=JSON.parse(localStorage.getItem('gd')||'null');if(_o&&_o.cards)D=_o}catch(e){}}
D.t=Object.assign({offers:true,compare:true,calc:true,share:true,ar:true,refer:true,theme:true,chat:true},D.t);
D.offers=D.offers||[];D.url=D.url||'';
fixD();
function PU(){var u=D.url||(location.origin+location.pathname);return(/claude/i.test(u)||!/^https?:/i.test(u))?'':u}
D.refMsg=D.refMsg||('Hi! I found a great credit card advisor, '+D.name+'. Check your eligibility and offers here:');
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var TR={en:{flip:'Tap the card to flip it',call:'Call',wa:'WhatsApp',save:'Save contact',share:'Share',qr:'QR code',all:'All',cards:'Cards',banks:'Banks I work with',find:'Find my best card',name:'Name',mob:'Mobile number',sal:'Monthly salary (AED)',emp:'Employment',sa:'Salaried',se:'Self-employed',chk:'Check eligibility',need:'Enter your name and mobile number.',apply:'Apply',cmp:'Compare',fee:'Annual fee',cb:'Cashback',min:'Min. salary',calc:'Cashback calculator',spend:'Monthly spend (AED)',mo:'per month',yr:'per year',best:'Best match',cont:'Continue on WhatsApp',none:'No match yet. Message me for options.',copied:'Number copied',link:'Link copied',contact:'Contact',tapc:'Tap Call or WhatsApp below',pick:'Select 2 or 3 cards to compare',hi:'Hi',light:'Light',dark:'Dark',ref:'Refer a friend',refd:'Know someone who needs a credit card? Send them my details.',fname:"Friend's name",fmob:"Friend's mobile (optional)",send:'Send on WhatsApp'},
ar:{flip:'اضغط على البطاقة لقلبها',call:'اتصال',wa:'واتساب',save:'حفظ جهة الاتصال',share:'مشاركة',qr:'رمز QR',all:'الكل',cards:'البطاقات',banks:'البنوك التي أتعامل معها',find:'اعثر على أفضل بطاقة',name:'الاسم',mob:'رقم الجوال',sal:'الراتب الشهري (درهم)',emp:'نوع العمل',sa:'موظف',se:'عمل حر',chk:'تحقق من الأهلية',need:'أدخل اسمك ورقم جوالك.',apply:'قدّم الآن',cmp:'مقارنة',fee:'الرسوم السنوية',cb:'الاسترداد النقدي',min:'الحد الأدنى للراتب',calc:'حاسبة الاسترداد النقدي',spend:'الإنفاق الشهري (درهم)',mo:'شهرياً',yr:'سنوياً',best:'الأنسب لك',cont:'تابع عبر واتساب',none:'لا توجد نتيجة بعد. راسلني لمعرفة الخيارات.',copied:'تم نسخ الرقم',link:'تم نسخ الرابط',contact:'التواصل',tapc:'اضغط اتصال أو واتساب أدناه',pick:'اختر بطاقتين أو ثلاث للمقارنة',hi:'مرحباً',light:'فاتح',dark:'داكن',ref:'رشّح صديقاً',refd:'تعرف شخصاً يحتاج بطاقة ائتمان؟ أرسل له بياناتي.',fname:'اسم صديقك',fmob:'جوال صديقك (اختياري)',send:'أرسل عبر واتساب'}};
var SAL=[{v:4000,en:'Below 5,000',ar:'أقل من 5,000'},{v:7500,en:'5,000 – 10,000',ar:'5,000 – 10,000'},{v:15000,en:'10,000 – 20,000',ar:'10,000 – 20,000'},{v:25000,en:'Above 20,000',ar:'أكثر من 20,000'}];
var lang='en',flip=false,filter='',cats=[],sel=[],owner=false,popTimer=null,bt=null,bi=0;
try{lang=localStorage.getItem('lg')==='ar'?'ar':'en'}catch(e){}
var T=function(k){return(TR[lang]&&TR[lang][k])||TR.en[k]||k};
var waNum=function(){return String(D.wa).replace(/\D/g,'')};
var GFX='<svg class="bg" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.5"><circle cx="160" cy="90" r="40"/><circle cx="160" cy="90" r="70"/><circle cx="160" cy="90" r="100"/></g></svg><svg class="chipg" width="84" height="30" viewBox="0 0 84 30" aria-hidden="true"><rect y="1" width="38" height="28" rx="6" fill="#e6c36a"/><path d="M0 10h38M0 20h38M13 1v28M25 1v28" stroke="#b8942f" stroke-width="1" fill="none"/><path d="M52 8c5 4 5 10 0 14M60 4c8 7 8 15 0 22M68 0c11 10 11 20 0 30" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></svg>';
function tint(c){var p=['#1f2f8a','#0a8a6a','#7c3aed','#d97706','#be123c'];return p[Math.max(0,cats.indexOf(c))%p.length]}
function toast(m,ms){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(function(){t.style.display='none'},ms||2200)}

function shell(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#app').innerHTML='<div class="wrap"><div id="ban"></div><div id="cc"></div><div class="hint">'+T('flip')+'</div><div id="hrs"></div><div class="row" id="act"></div><div class="tools" id="tools"></div><div id="qrw"></div><div id="cards"></div><div id="cmp"></div><div id="quiz"></div><div id="calc"></div><div id="banks"></div><div id="trust"></div><div id="elig"></div><div id="docs"></div><div id="book"></div><div id="ref"></div><div class="own" id="own"></div></div>';
  ban();card();acts();tools();chatRender();cardsSec();cmpSec();calcSec();banksSec();eligSec();docsSec();bookSec();quizSec();trustSec();hrsSec();refSec();ownBtn();
}
function ban(){
  clearInterval(bt);var el=$('#ban');
  var lo=liveOffers();if(!D.t.offers||!lo.length){el.innerHTML='';return}
  var show=function(){el.innerHTML='<div class="banner"><span class="bt">'+L('OFFER','عرض')+'</span><span class="bx">'+esc(lo[bi%lo.length])+'</span></div>';bi++};
  show();if(lo.length>1)bt=setInterval(show,3500);
}
function card(){
  var h=flip
   ?'<div><small>'+T('contact')+'</small></div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><h1 dir="ltr">'+esc(D.phone)+'</h1><small>'+T('tapc')+'</small></div></div>'
   :'<div><small>'+esc(D.title)+'</small></div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px"><div><h1>'+esc(D.name)+'</h1><small>'+esc(D.tag)+'</small></div>'+(window.QRCode&&D.t.cardqr!==false?'<div id="cqr" class="qrc"></div>':'')+'</div>';
  $('#cc').innerHTML='<div class="cc" onclick="flip=!flip;card()">'+GFX+h+'</div>';
  if(window.QRCode&&$('#cqr')){try{new QRCode($('#cqr'),{text:PU()||('tel:'+D.phone),width:76,height:76})}catch(e){}}
}
function acts(){
  var h=D.t.call!==false?'<a class="btn" onclick="track(\'call\')" href="tel:'+esc(D.phone)+'">'+T('call')+'</a>':'';
  if(D.t.wa)h+='<a class="btn p" onclick="track(\'whatsapp\')" href="https://wa.me/'+waNum()+'" target="_blank" rel="noopener">'+T('wa')+'</a>';

}
function eligSec(){
  $('#elig').innerHTML=D.t.elig?'<h2>'+T('find')+'</h2><label>'+T('name')+'</label><input id="en" autocomplete="name"><label>'+T('mob')+'</label><input id="ep" type="tel" autocomplete="tel"><label>'+T('sal')+'</label><input id="es" inputmode="numeric" oninput="dbrLive()" placeholder="'+L('For example 12,000','مثال 12,000')+'"><label>'+T('emp')+'</label><select id="ee"><option value="0">'+T('sa')+'</option><option value="1">'+T('se')+'</option></select>'+(D.t.eligx!==false?xtraHtml():'')+'<div class="err" id="err"></div><button class="btn p" style="width:100%" onclick="chk()">'+T('chk')+'</button><div class="hint" style="text-align:start;margin:8px 0 0">'+L('By continuing you agree to be contacted about your request.','بالمتابعة فإنك توافق على التواصل معك بخصوص طلبك.')+'</div><div id="res"></div>':'';
}
function dbrCalc(){
  var sal=nz(xv('es')),lim=nz(xv('el')),emi=nz(xv('em')),liab=emi+lim*0.05;
  return{s:sal,liab:liab,d:sal?liab/sal*100:0};
}
function capOf(c){return nz(c.dbrMax)||(+D.dbrMax||50)}
function dbrLive(){
  var el=$('#dbrm');if(!el)return;
  var r=dbrCalc();
  if(!r.s){el.innerHTML='';return}
  var cap=+D.dbrMax||50,col=r.d<=cap*0.8?'#128C4A':(r.d<=cap?'#d98a00':'#c0392b'),w=Math.min(100,r.d);
  el.innerHTML='<div class="hint" style="text-align:start;margin:2px 0 6px">'+L('Estimated DBR','نسبة الدين التقديرية')+': <b style="color:'+col+'">'+r.d.toFixed(1)+'%</b> ('+L('limit','الحد')+' '+cap+'%)</div><div style="position:relative;height:8px;border-radius:4px;background:var(--line);margin-bottom:12px"><div style="height:8px;width:'+w+'%;border-radius:4px;background:'+col+'"></div><div style="position:absolute;left:'+Math.min(100,cap)+'%;top:-3px;width:2px;height:14px;background:var(--ink)"></div></div>';
}
function chk(){
  var n=$('#en').value.trim(),p=$('#ep').value.trim(),r=dbrCalc();
  if(!n||!p){$('#err').textContent=T('need');return}
  if(!r.s){$('#err').textContent=L('Enter your monthly salary.','أدخل راتبك الشهري.');return}
  $('#err').textContent='';
  var e=+$('#ee').value,cap=+D.dbrMax||50;
  var ok=D.cards.filter(function(c){return(!nz(c.min)||nz(c.min)<=r.s)&&r.d<=capOf(c)}).sort(function(a,b){return nz(b.cb)-nz(a.cb)});
  var score=ok.length?(r.d<=cap*0.8?'HOT':'WARM'):'LOW';
  var banks=[];ok.forEach(function(c){var b=(c.bank||'').trim();if(b&&banks.indexOf(b)<0)banks.push(b)});
  var msg='Hi '+D.name+', please check my card eligibility.\nName: '+n+'\nMobile: '+p+'\nSalary: AED '+r.s.toLocaleString('en')+'\nEmployment: '+(e?'Self-employed':'Salaried')+xtraMsg()+'\nEstimated DBR: '+r.d.toFixed(1)+'%'+(banks.length?'\nLikely banks: '+banks.join(', '):'')+(ok.length?'\nInterested in: '+ok.slice(0,2).map(function(c){return c.n}).join(', '):'')+(D.t.scoreMsg===true?'\nLead score: '+score:'')+srcLine();
  logLead('eligibility',n,p,msg,score);
  var g={},order=[];
  ok.forEach(function(c){var b=(c.bank||'').trim()||L('Other cards','بطاقات أخرى');if(!g[b]){g[b]=[];order.push(b)}g[b].push(c.n)});
  var list=order.map(function(b){return'<div style="margin-top:8px"><b>'+esc(b)+'</b><br><span style="color:var(--mut);font-size:14px">'+esc(g[b].join(', '))+'</span></div>'}).join('');
  $('#res').innerHTML='<div class="box"><b>'+L('Likely to qualify','المرجح قبولك')+'</b>'+(ok.length?list:'<div style="margin-top:8px">'+T('none')+'</div>')+'<div class="hint" style="text-align:start;margin:10px 0 0">'+L('Estimated DBR','نسبة الدين التقديرية')+' '+r.d.toFixed(1)+'%. '+L('This is an estimate. Each bank decides.','هذا تقدير فقط. القرار النهائي للبنك.')+'</div><a class="btn p" style="display:block;margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg)+'">'+T('cont')+'</a></div>';
}
function ownBtn(){$('#own').innerHTML=''}

function showPop(){
  clearTimeout(popTimer);
  if(!D.t.popup||owner)return;
  popTimer=setTimeout(function(){
    $('#pop').innerHTML='<div><a href="tel:'+esc(D.phone)+'">'+T('call')+' '+esc(D.phone)+'</a><button aria-label="Close" onclick="$(\'#pop\').className=\'\'">×</button></div>';
    $('#pop').className='open';
  },Math.max(0,+D.delay||0)*1000);
}

function openAdm(){try{localStorage.setItem('nt','1')}catch(e){}admRender();$('#adm').className='open'}
function closeAdm(){$('#adm').className='';sel=[];shell();showPop()}
function admRender(){
  var TG=[['Page sections',{cards:'Cards list',banks:'Banks I work with',elig:'Eligibility check form',eligx:'Extra details in the form (company, existing card, limit, EMI)',quiz:'Card finder quiz',compare:'Card comparison',calc:'Cashback calculator',docs:'Document checklist',book:'Book a call',track:'Count visits and taps (needs the Google Sheet link)',scoreMsg:'Show lead score (HOT, WARM, LOW) in the WhatsApp message',refer:'Refer a friend',offers:'Offers banner',hours:'Business hours indicator',trust:'Trust badges and testimonials'}],['Buttons and tools',{call:'Call button',wa:'WhatsApp button',save:'Save contact button',share:'Share button',qrbtn:'QR code button',cardqr:'QR code on the card',ar:'Arabic / English switch',theme:'Light / dark switch',popup:'Contact number popup'}],['Chat assistant',{chat:'Chat assistant (on or off)',dbr:'DBR check in the chat',badge:'Verified tick on the avatar',dot:'Online status dot'}]];
  var h='<div class="wrap"><h2>Admin panel</h2>';
  [['name','Name'],['title','Title'],['tag','Tagline'],['phone','Phone'],['wa','WhatsApp number'],['url','Page link (used for Share and QR)']].forEach(function(f){
    h+='<label>'+f[1]+'</label><input value="'+esc(D[f[0]])+'" onchange="D.'+f[0]+'=this.value">';
  });
  h+='<label>Popup delay (seconds)</label><input type="number" min="0" value="'+esc(D.delay)+'" onchange="D.delay=+this.value"><h2>Turn features on or off</h2>';
  TG.forEach(function(g){
    h+='<h3 style="font-size:14px;margin:16px 0 4px;color:var(--mut)">'+g[0]+'</h3>';
    Object.keys(g[1]).forEach(function(k){
      h+='<div class="tg"><span>'+g[1][k]+'</span><input type="checkbox"'+(D.t[k]!==false?' checked':'')+' onchange="D.t.'+k+'=this.checked"></div>';
    });
  });
  h+='<label>Admin password (for the hidden theme-button entry)</label><input value="'+esc(D.pw||'111')+'" onchange="D.pw=this.value">';
  h+='<label>DBR limit % used by the chat calculator</label><input type="number" value="'+esc(+D.dbrMax||50)+'" onchange="D.dbrMax=+this.value">';
  h+='<label>Refer a friend message (the page link is added automatically)</label><textarea rows="3" onchange="D.refMsg=this.value">'+esc(D.refMsg)+'</textarea>'+admExtra()+'<h2>Offers banner</h2><label>One offer per line. Optional dates (YYYY-MM-DD): Offer text | end date, or Offer text | start date | end date</label><textarea rows="3" onchange="D.offers=this.value.split(\'\\n\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.offers.join('\n'))+'</textarea>'+catHtml()+qaHtml()+'<h2>Cards</h2>';
  D.cards.forEach(function(c,i){
    h+='<div class="crow"><input placeholder="Name" value="'+esc(c.n)+'" onchange="D.cards['+i+'].n=this.value"><select onchange="D.cards['+i+'].cat=this.value">'+catOpts(c.cat)+'</select><input placeholder="Bank (for example ADCB)" value="'+esc(c.bank||'')+'" onchange="D.cards['+i+'].bank=this.value"><input placeholder="DBR limit % for this card (optional, default '+esc(+D.dbrMax||50)+')" value="'+esc(c.dbrMax||'')+'" onchange="D.cards['+i+'].dbrMax=this.value"><input placeholder="Description" value="'+esc(c.d)+'" onchange="D.cards['+i+'].d=this.value"><input placeholder="Annual fee" value="'+esc(c.fee||'')+'" onchange="D.cards['+i+'].fee=this.value"><input placeholder="Cashback (e.g. 5% or 5% on groceries)" value="'+esc(c.cb||'')+'" onchange="D.cards['+i+'].cb=this.value"><input placeholder="Min. salary (e.g. 5,000 or AED 5,000+)" value="'+esc(c.min||'')+'" onchange="D.cards['+i+'].min=this.value"><button class="chip" onclick="D.cards.splice('+i+',1);admRender()">Remove</button></div>';
  });
  h+='<button class="chip" onclick="D.cards.push({n:\'New card\',cat:(D.cats[0]||\'General\'),d:\'\',fee:\'\',cb:\'\',min:\'\'});admRender()">Add card</button>';
  h+='<h2>Banks</h2><label>Separate with commas</label><textarea rows="3" onchange="D.banks=this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.banks.join(', '))+'</textarea>';
  h+='<h2>GitHub auto-update</h2><label>Owner (GitHub username)</label><input placeholder="Your GitHub username, e.g. gokul123" value="'+esc(ghCfg().o)+'" onchange="ghSet(\'o\',this.value)"><label>Repository name</label><input placeholder="Repository name, e.g. gokul-card" value="'+esc(ghCfg().r)+'" onchange="ghSet(\'r\',this.value)"><label>Branch</label><input value="'+esc(ghCfg().b)+'" onchange="ghSet(\'b\',this.value)"><label>Token (kept on this device only)</label><input placeholder="Paste your token here" type="password" autocomplete="off" value="'+esc(ghCfg().t)+'" onchange="ghSet(\'t\',this.value)"><div class="err" id="st"></div><div class="row"><button class="btn" onclick="closeAdm()">Close</button><button class="btn p" onclick="save()">Save and publish</button></div><div class="row"><button class="btn" onclick="saveDev()">Save on this device</button><button class="btn" onclick="copyData()">Copy data</button></div><div class="row"><button class="btn p" onclick="ghSave()">Save to GitHub (live for everyone)</button></div></div>';
  $('#adm').innerHTML=h;
}
async function save(){
  var st=$('#st');st.style.color='var(--mut)';st.textContent='Publishing…';
  try{
    var a=await claude.use('artifact');
    if(!a){st.style.color='#c0392b';st.textContent='Publishing is not available in this view.';return}
    var c=document.documentElement.cloneNode(true);
    c.removeAttribute('dir');c.removeAttribute('data-theme');c.setAttribute('lang','en');
    ['#app','#adm','#pop','#toast','#corner','#chat'].forEach(function(s){var n=c.querySelector(s);n.innerHTML='';n.textContent='';n.removeAttribute('style');if(s!=='#toast')n.className=''});
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    await a.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(e){
    st.style.color='#c0392b';
    st.textContent=(e&&e.code==='conflict')?'Someone else published first. The page reloaded.':'Could not publish. Only the page owner can save changes.';
  }
}

if(D.t.theme){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('th')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}}
shell();showPop();
ghLoad();
if(location.hash==='#admin')pwAsk();
visitOnce();
window.addEventListener('hashchange',function(){if(location.hash==='#admin')pwAsk()});
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var u=await claude.use('user');
    if(u&&u.isOwner()){owner=true;ownBtn();clearTimeout(popTimer);$('#pop').className=''}
  }catch(e){}
})();
</script>
</body>
