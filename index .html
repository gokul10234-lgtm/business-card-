  if(k==='dbr'){dbrS={step:1,v:[]};addMsg('b',L('Let us check your eligibility. What is your monthly salary (AED)?','لنتحقق من أهليتك. ما هو راتبك الشهري (درهم)؟'));return}
  var a=ans(k);
  addMsg('b',a||L('I am not sure about that. Message me on WhatsApp and I will answer personally.','لست متأكداً من ذلك. راسلني عبر واتساب وسأجيبك شخصياً.'));
}
var dbrS={step:0,v:[]};
function num(s){s=String(s).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[,\s]/g,'');var n=parseFloat(s);return isNaN(n)||n<0?null:n}
function dbrStep(q){
  var n=num(q);
  if(n===null){addMsg('b',L('Please type a number, for example 15000.','اكتب رقماً، مثلاً 15000.'));return}
  if(dbrS.step===1&&n<=0){addMsg('b',L('Salary must be more than 0. Type your monthly salary.','يجب أن يكون الراتب أكبر من صفر. اكتب راتبك الشهري.'));return}
  dbrS.v.push(n);dbrS.step++;
  if(dbrS.step===2){addMsg('b',L('Total monthly loan or EMI payments (AED)? Type 0 if none.','إجمالي أقساط القروض الشهرية (درهم)؟ اكتب 0 إن لم يوجد.'));return}
  if(dbrS.step===3){addMsg('b',L('Total limit of your existing credit cards (AED)? Banks usually count about 5% of card limits as a monthly payment. Type 0 if none.','إجمالي حدود بطاقاتك الائتمانية الحالية (درهم)؟ تحتسب البنوك عادةً نحو 5% من الحد كالتزام شهري. اكتب 0 إن لم توجد.'));return}
  var s=dbrS.v[0],liab=dbrS.v[1]+dbrS.v[2]*0.05,cap=+D.dbrMax||50,d=liab/s*100,room=s*cap/100-liab;
  dbrS={step:0,v:[]};
  var fmt=function(x){return Math.round(x).toLocaleString('en')};
  var rec=D.cards.filter(function(c){return!c.min||c.min<=s}).map(function(c){return c.n});
  var t=L('Your estimated DBR is ','نسبة الدين التقديرية لديك ')+d.toFixed(1)+'% ('+L('monthly payments','الالتزامات الشهرية')+' AED '+fmt(liab)+').\n';
  if(d<=cap){
    t+=L('This is within the usual '+cap+'% limit. You could add about AED '+fmt(room)+' per month in new payments.\n','هذه ضمن الحد المعتاد '+cap+'%. يمكنك إضافة نحو '+fmt(room)+' درهم شهرياً كالتزامات جديدة.\n');
    t+=rec.length?L('Cards to consider for your salary: ','بطاقات مناسبة لراتبك: ')+rec.join(', ')+'.':L('No sample card matches this salary yet. Message me for options.','لا توجد بطاقة مطابقة لهذا الراتب حالياً. راسلني للخيارات.');
  }else{
    t+=L('This is above the usual '+cap+'% limit, so approval may be difficult. Message me and we can look at options.','هذه أعلى من الحد المعتاد '+cap+'% وقد يصعب الحصول على الموافقة. راسلني لنبحث الخيارات.');
  }
  t+=L('\nThis is an estimate. Each bank decides.','\nهذا تقدير فقط. القرار النهائي للبنك.');
  addMsg('b',t);
}
function chatQ(i){chatAsk(CQ[i][1],CQ[i][0])}
function chatSend(){var i=$('#ci'),q=i.value.trim();if(!q)return;i.value='';chatAsk(q)}
function chatRender(){
  var el=$('#chat');
  if(D.t.chat===false){el.innerHTML='';return}
  if(!chatOpen){el.innerHTML='<button class="fab" aria-label="Chat" onclick="chatToggle()">'+CHATSVG+'</button>';return}
  if(!chatMsgs.length)chatMsgs.push({r:'b',t:L('Hi! I am the assistant for '+D.name+'. Ask me about cards, fees, salary or documents.','مرحباً! أنا مساعد '+D.name+'. اسألني عن البطاقات والرسوم والراتب والمستندات.')});
  CQ=[['dbr',L('DBR check','فحص نسبة الدين')],['cash',L('Best cashback','أفضل استرداد')],['sal',L('Salary needed','الراتب المطلوب')],['fee',L('Fees','الرسوم')],['docs',L('Documents','المستندات')],['banks',L('Banks','البنوك')],['apply',L('How to apply','كيف أقدّم')]];
  el.innerHTML='<div class="chatp"><div class="ch"><b>'+esc(L('Chat with '+D.name,'تحدث مع '+D.name))+'</b><button aria-label="Close" onclick="chatToggle()">×</button></div><div class="cm" id="cm"></div><div class="cq">'+CQ.map(function(x,i){return'<button class="chip" onclick="chatQ('+i+')">'+esc(x[1])+'</button>'}).join('')+'</div><div class="cin"><input id="ci" placeholder="'+L('Type your question','اكتب سؤالك')+'" onkeydown="if(event.key===\'Enter\')chatSend()"><button class="btn p" onclick="chatSend()">'+L('Send','إرسال')+'</button></div><a class="cw" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'">'+T('wa')+'</a></div>';
  var cm=$('#cm');
  chatMsgs.forEach(function(m){var d=document.createElement('div');d.className='mb'+(m.r==='u'?' u':'');d.textContent=m.t;cm.appendChild(d)});
  cm.scrollTop=cm.scrollHeight;
}
function setL(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lg',lang)}catch(e){}shell()}
async function saveC(){
  var v='BEGIN:VCARD\nVERSION:3.0\nFN:'+D.name+'\nTITLE:'+D.title+'\nTEL;TYPE=CELL:'+D.phone+'\nURL:'+D.url+'\nEND:VCARD';
  try{
    var f=new File([v],D.name+'.vcf',{type:'text/vcard'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:D.name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(D.name+' '+D.phone);toast(T('copied'))}catch(e){location.href='tel:'+D.phone}
}
async function shareP(){
  if(navigator.share){try{await navigator.share({title:D.name,url:D.url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(D.url);toast(T('link'))}catch(e){}
}
function qr(){
  var w=$('#qrw');
  if(w.innerHTML){w.innerHTML='';return}
  w.innerHTML='<div id="qr"></div>';
  new QRCode($('#qr'),{text:D.url,width:200,height:200});
}
function cardsSec(){
  var el=$('#cards');
  if(!D.t.cards){el.innerHTML='';return}
  cats=Array.from(new Set(D.cards.map(function(c){return c.cat})));
  if(filter&&cats.indexOf(filter)<0)filter='';
  var chips='<button class="chip'+(!filter?' on':'')+'" onclick="setF(-1)">'+T('all')+'</button>'+cats.map(function(c,i){return'<button class="chip'+(c===filter?' on':'')+'" onclick="setF('+i+')">'+esc(c)+'</button>'}).join('');
  var list=D.cards.map(function(c,i){return{c:c,i:i}}).filter(function(x){return!filter||x.c.cat===filter}).map(function(x){
    var c=x.c,msg=T('hi')+' '+D.name+', I am interested in the '+c.n+' card.';
    return'<div class="item">'+(D.t.compare?'<input class="ck" type="checkbox" aria-label="'+T('cmp')+'"'+(sel.indexOf(x.i)>=0?' checked':'')+' onchange="pick('+x.i+',this.checked)">':'')+'<i class="th" style="background:'+tint(c.cat)+'"></i><div class="info"><b>'+esc(c.n)+'</b><span>'+esc(c.d)+'</span></div><a class="mini" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg)+'">'+T('apply')+'</a></div>'}).join('');
  el.innerHTML='<h2>'+T('cards')+'</h2><div class="chips">'+chips+'</div>'+list;
}
function setF(i){filter=i<0?'':cats[i];cardsSec()}
function pick(i,on){
  var k=sel.indexOf(i);
  if(on&&k<0){if(sel.length>=3){cardsSec();return}sel.push(i)}
  if(!on&&k>=0)sel.splice(k,1);
  cmpSec();
}
function cmpSec(){
  var el=$('#cmp');
  if(!D.t.cards||!D.t.compare){el.innerHTML='';return}
  if(sel.length<2){el.innerHTML=sel.length===1?'<div class="hint">'+T('pick')+'</div>':'';return}
  var cs=sel.map(function(i){return D.cards[i]}).filter(Boolean);
  var row=function(l,f){return'<tr><th>'+l+'</th>'+cs.map(function(c){return'<td>'+f(c)+'</td>'}).join('')+'</tr>'};
  el.innerHTML='<h2>'+T('cmp')+'</h2><div style="overflow-x:auto"><table class="cmp"><tr><th></th>'+cs.map(function(c){return'<th>'+esc(c.n)+'</th>'}).join('')+'</tr>'+row(T('fee'),function(c){return esc(c.fee||'-')})+row(T('cb'),function(c){return c.cb?c.cb+'%':'-'})+row(T('min'),function(c){return c.min?'AED '+Number(c.min).toLocaleString('en'):'-'})+'</table></div>';
}
function calcSec(){
  $('#calc').innerHTML=D.t.calc?'<h2>'+T('calc')+'</h2><label>'+T('spend')+'</label><input id="sp" type="number" inputmode="numeric" min="0" oninput="calc()"><div id="cr"></div>':'';
}
function calc(){
  var s=+$('#sp').value||0;
  if(!s){$('#cr').innerHTML='';return}
  var r=D.cards.filter(function(c){return c.cb}).map(function(c){return{c:c,m:s*c.cb/100}}).sort(function(a,b){return b.m-a.m});
  $('#cr').innerHTML=r.map(function(x,i){return'<div class="item"><div class="info"><b>'+esc(x.c.n)+(i===0?' · '+T('best'):'')+'</b><span>AED '+x.m.toFixed(0)+' '+T('mo')+' · AED '+(x.m*12).toFixed(0)+' '+T('yr')+'</span></div></div>'}).join('');
}
function banksSec(){
  $('#banks').innerHTML=D.t.banks?'<h2>'+T('banks')+'</h2><div class="bk">'+D.banks.map(function(b){return'<span>'+esc(b)+'</span>'}).join('')+'</div>':'';
}
function eligSec(){
  $('#elig').innerHTML=D.t.elig?'<h2>'+T('find')+'</h2><label>'+T('name')+'</label><input id="en" autocomplete="name"><label>'+T('mob')+'</label><input id="ep" type="tel" autocomplete="tel"><label>'+T('sal')+'</label><select id="es">'+SAL.map(function(s,i){return'<option value="'+i+'">'+s[lang]+'</option>'}).join('')+'</select><label>'+T('emp')+'</label><select id="ee"><option value="0">'+T('sa')+'</option><option value="1">'+T('se')+'</option></select><div class="err" id="err"></div><button class="btn p" style="width:100%" onclick="chk()">'+T('chk')+'</button><div id="res"></div>':'';
}
function chk(){
  var n=$('#en').value.trim(),p=$('#ep').value.trim();
  if(!n||!p){$('#err').textContent=T('need');return}
  $('#err').textContent='';
  var s=SAL[+$('#es').value],e=+$('#ee').value;
  var rec=D.cards.filter(function(c){return!c.min||c.min<=s.v}).sort(function(a,b){return(b.cb||0)-(a.cb||0)});
  var msg='Hi '+D.name+', please check my card eligibility.\nName: '+n+'\nMobile: '+p+'\nSalary: '+s.en+'\nEmployment: '+(e?'Self-employed':'Salaried')+(rec.length?'\nInterested in: '+rec.slice(0,2).map(function(c){return c.n}).join(', '):'');
  $('#res').innerHTML='<div class="box"><b>'+T('best')+'</b>'+(rec.length?rec.slice(0,3).map(function(c){return'<div style="margin-top:6px">'+esc(c.n)+' <span style="color:var(--mut)">· '+esc(c.d)+'</span></div>'}).join(''):'<div style="margin-top:6px">'+T('none')+'</div>')+'<a class="btn p" style="display:block;margin-top:12px" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg)+'">'+T('cont')+'</a></div>';
}
function ownBtn(){$('#own').innerHTML=owner?'<button class="chip" onclick="openAdm()">Admin panel</button>':''}

function showPop(){
  clearTimeout(popTimer);
  if(!D.t.popup||owner)return;
  popTimer=setTimeout(function(){
    $('#pop').innerHTML='<div><a href="tel:'+esc(D.phone)+'">'+T('call')+' '+esc(D.phone)+'</a><button aria-label="Close" onclick="$(\'#pop\').className=\'\'">×</button></div>';
    $('#pop').className='open';
  },Math.max(0,+D.delay||0)*1000);
}

function openAdm(){admRender();$('#adm').className='open'}
function closeAdm(){$('#adm').className='';sel=[];shell();showPop()}
function admRender(){
  var tl={cards:'Show cards',banks:'Show banks',elig:'Show eligibility check',wa:'Show WhatsApp button',popup:'Contact number popup',offers:'Offers banner',compare:'Card comparison',calc:'Cashback calculator',share:'Share and QR',ar:'Arabic toggle',refer:'Refer a friend',theme:'Light/dark toggle',chat:'Chat assistant'};
  var h='<div class="wrap"><h2>Admin panel</h2>';
  [['name','Name'],['title','Title'],['tag','Tagline'],['phone','Phone'],['wa','WhatsApp number'],['url','Page link (used for Share and QR)']].forEach(function(f){
    h+='<label>'+f[1]+'</label><input value="'+esc(D[f[0]])+'" onchange="D.'+f[0]+'=this.value">';
  });
  h+='<label>Popup delay (seconds)</label><input type="number" min="0" value="'+esc(D.delay)+'" onchange="D.delay=+this.value"><h2>Features</h2>';
  Object.keys(tl).forEach(function(k){
    h+='<div class="tg"><span>'+tl[k]+'</span><input type="checkbox"'+(D.t[k]?' checked':'')+' onchange="D.t.'+k+'=this.checked"></div>';
  });
  h+='<label>DBR limit % used by the chat calculator</label><input type="number" value="'+esc(+D.dbrMax||50)+'" onchange="D.dbrMax=+this.value">';
  h+='<label>Refer a friend message (the page link is added automatically)</label><textarea rows="3" onchange="D.refMsg=this.value">'+esc(D.refMsg)+'</textarea><h2>Offers banner</h2><label>One offer per line</label><textarea rows="3" onchange="D.offers=this.value.split(\'\\n\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.offers.join('\n'))+'</textarea><h2>Cards</h2>';
  D.cards.forEach(function(c,i){
    h+='<div class="crow"><input placeholder="Name" value="'+esc(c.n)+'" onchange="D.cards['+i+'].n=this.value"><input placeholder="Category" value="'+esc(c.cat)+'" onchange="D.cards['+i+'].cat=this.value"><input placeholder="Description" value="'+esc(c.d)+'" onchange="D.cards['+i+'].d=this.value"><input placeholder="Annual fee" value="'+esc(c.fee||'')+'" onchange="D.cards['+i+'].fee=this.value"><input type="number" step="0.1" placeholder="Cashback %" value="'+esc(c.cb||'')+'" onchange="D.cards['+i+'].cb=+this.value"><input type="number" placeholder="Min. salary (AED)" value="'+esc(c.min||'')+'" onchange="D.cards['+i+'].min=+this.value"><button class="chip" onclick="D.cards.splice('+i+',1);admRender()">Remove</button></div>';
  });
  h+='<button class="chip" onclick="D.cards.push({n:\'New card\',cat:\'General\',d:\'\',fee:\'\',cb:0,min:0});admRender()">Add card</button>';
  h+='<h2>Banks</h2><label>Separate with commas</label><textarea rows="3" onchange="D.banks=this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean)">'+esc(D.banks.join(', '))+'</textarea>';
  h+='<div class="err" id="st"></div><div class="row"><button class="btn" onclick="closeAdm()">Close</button><button class="btn p" onclick="save()">Save and publish</button></div></div>';
  $('#adm').innerHTML=h;
}
async function save(){
  var st=$('#st');st.style.color='var(--mut)';st.textContent='Publishing…';
  try{
    var a=await claude.use('artifact');
    if(!a){st.style.color='#c0392b';st.textContent='Publishing is not available in this view.';return}
    var c=document.documentElement.cloneNode(true);
    c.removeAttribute('dir');c.removeAttribute('data-theme');c.setAttribute('lang','en');
    ['#app','#adm','#pop','#toast','#corner','#chat'].forEach(function(s){var n=c.querySelector(s);n.innerHTML='';n.textContent='';n.removeAttribute('style');if(s!=='#toast')n.className=''});
    c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
    await a.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(e){
    st.style.color='#c0392b';
    st.textContent=(e&&e.code==='conflict')?'Someone else published first. The page reloaded.':'Could not publish. Only the page owner can save changes.';
  }
}

if(D.t.theme){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('th')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}}
shell();showPop();
(async function(){
  try{
    if(!window.claude||!claude.use)return;
    var u=await claude.use('user');
    if(u&&u.isOwner()){owner=true;ownBtn();clearTimeout(popTimer);$('#pop').className=''}
  }catch(e){}
})();
</script>
</body>
</html>
